<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1827"><meta name="description" content="CasaRadar Roma: organizza gli annunci in affitto a Roma Est e Nord-Est.">
<link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>CasaRadar Roma</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><span class="brand-symbol">⌂</span><div><b>CasaRadar</b><small>ROMA</small></div></div><p class="side-overline">IL TUO SPAZIO</p><nav id="desktopNav"><button data-page="annunci" class="active">⌂ <span>Annunci</span></button><button data-page="preferiti">♡ <span>Preferiti</span></button><button data-page="ricerche">☷ <span>La mia ricerca</span></button><button data-page="impostazioni">⚙ <span>Impostazioni</span></button></nav><div class="sidebar-bottom"><span class="status-dot"></span> Fonti da configurare <small>Consulta lo stato del monitoraggio nelle impostazioni.</small></div></aside>
<div class="main-wrap"><header class="topbar"><div class="brand mobile-brand"><span class="brand-symbol">⌂</span><div><b>CasaRadar</b><small>ROMA</small></div></div><span class="top-label">Il tuo osservatorio affitti</span><button class="icon-button" id="settingsQuick" aria-label="Apri impostazioni">⚙</button></header>
<main id="app" aria-live="polite"></main>
<footer class="mobile-nav"><button data-page="annunci" class="active"><span>⌂</span>Annunci</button><button data-page="preferiti"><span>♡</span>Preferiti</button><button data-page="ricerche"><span>☷</span>Ricerca</button><button data-page="impostazioni"><span>⚙</span>Altro</button></footer>
</div></div>
<dialog id="listingDialog"><form id="listingForm" method="dialog"><div class="dialog-heading"><div><span class="eyebrow">INSERIMENTO MANUALE</span><h2>Aggiungi un annuncio</h2></div><button id="closeDialog" type="button" class="icon-button" aria-label="Chiudi">✕</button></div><div class="form-grid"><label class="full">Titolo <input name="title" required maxlength="150" placeholder="Bilocale in affitto a Centocelle"></label><label>Prezzo mensile (€) <input name="price" type="number" min="1" step="1" required placeholder="750"></label><label>Superficie (m²) <input name="sqm" type="number" min="1" step="1" required placeholder="55"></label><label>Zona <select name="zone" id="listingZone" required></select></label><label>Inserzionista <select name="seller"><option value="unknown">Non specificato</option><option value="private">Privato</option><option value="agency">Agenzia</option></select></label><label class="full">Link annuncio <input name="url" type="url" required placeholder="https://..."></label><label>Fonte <select name="source"><option>Immobiliare.it</option><option>Idealista</option><option>Subito</option><option>Bakeca</option><option>Altro</option></select></label><label>Contratto <select name="contract"><option value="unknown">Non specificato</option><option value="residential">Residenziale</option><option value="temporary">Transitorio</option><option value="tourist">Turistico</option></select></label><label class="full">Note personali <textarea name="notes" rows="3" placeholder="Piano, balcone, spese condominiali, ecc."></textarea></label></div><div class="dialog-actions"><button class="btn secondary" id="cancelDialog" type="button">Annulla</button><button class="btn primary" type="submit">Salva annuncio</button></div></form></dialog>
<input id="importFile" type="file" accept=".json,.csv,application/json,text/csv" hidden>
<div id="toast" class="toast" role="status"></div>
<script src="app.js" defer></script>
</body></html>
