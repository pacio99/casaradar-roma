<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Test Telegram • CasaRadar</title><style>body{font:16px system-ui,sans-serif;background:#0c1827;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}main{box-sizing:border-box;width:min(440px,92vw);background:#17283c;border:1px solid #35485e;border-radius:18px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:10px;margin-top:12px}input{background:#fff;border:0}button{background:#8de1c0;color:#092b22;border:0;font-weight:bold;cursor:pointer}p{line-height:1.6;color:#cad6e1}a{color:#8de1c0}#status{min-height:28px}</style></head><body><main><h1>🔔 Prova Telegram</h1><p>Inserisci solo la chiave amministrativa che hai impostato nelle variabili protette di Netlify. <strong>Non inserire mai il token Telegram in questa pagina.</strong></p><form id="f"><label for="key">Chiave amministrativa</label><input id="key" type="password" minlength="20" autocomplete="off" required placeholder="CASARADAR_ADMIN_KEY"><button id="send">Invia messaggio di prova</button></form><p id="status" role="status"></p><p><a href="/">← Torna a CasaRadar</a></p></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');const button=document.getElementById('send');button.disabled=true;status.textContent='Invio in corso…';try{const r=await fetch('/.netlify/functions/telegram-test',{method:'POST',headers:{'x-casaradar-admin-key':document.getElementById('key').value},cache:'no-store'});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw new Error('La funzione server non risponde con JSON (HTTP '+r.status+'). Controlla Netlify → Functions e il deploy.')}status.textContent=(j.message||j.error||'Errore imprevisto')+' (HTTP '+r.status+')';}catch(err){status.textContent=err.message||'Funzione non disponibile. Verifica il deploy con Netlify Functions.'}finally{button.disabled=false;document.getElementById('key').value=''}})</script></body></html>
